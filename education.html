<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Reliable paper-texture background image */
            background-image: url('https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .education {
            max-width: 700px;
            width: 100%;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .education:hover {
            transform: translateY(-3px);
        }

        .education h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 2rem;
            letter-spacing: 1px;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 10px;
        }

        .education p {
            color: #444;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }

        .education p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="education">
        <h1>MY EDUCATION</h1>
        <p>Hello! I am a student pursuing an undergraduate degree at PCCOE.</p>
        <p>I completed my 10th grade at Yashodham Public School with 75%.</p>
        <p>I completed my 12th grade at S.D. Patil College with 72%.</p>
    </div>
</body>

</html>
